name: SneakyNPCs
version: "${version}"
main: com.danidipp.sneakynpcs.SneakyNPCs
api-version: "26.2"
authors:
  - DaniDipp
description: "Paper plugin for managing NPC GUIs"
dependencies:
  server:
    SneakyUtils:
      load: BEFORE
      required: true
      join-classpath: true
    MagicSpells:
      load: BEFORE
      required: true
    SneakyItems:
      load: BEFORE
      required: true
    CoreProtect:
      load: BEFORE
      required: false
    SneakyMannequins:
      load: BEFORE
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false
