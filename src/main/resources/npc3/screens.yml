# NPC Screens 3 (/sneakynpcs opengui <npc>): how each NPC's window reads. Bundled in the jar, never copied to disk.
# The hub rows come from the NPC's root menu in npc/<id>.yml (custom rows are left out, a Sell row follows the
# last shop, Farewell fills a free row; at most 4). Everything here is optional:
#   name, title (the line under the name), portrait (default or carl)
#   labels: row text by menu type: shop, shop2, shop3, sell, quest, tailor, taxes, bank, external, external2;
#           external_hint / external2_hint for the line under an external row
# An NPC missing here gets its id spaced out ("JackTimbers" -> "Jack Timbers") and default labels.

